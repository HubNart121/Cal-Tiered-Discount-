<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการราคาส่วนลดขั้นบันได</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@100;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        /* ซ่อนลูกศรใน input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ไอคอน SVG แบบ Inline - แก้ไข Error Adjacent JSX elements
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                shoppingCart: <path d="m3.97 2 1.27 7.27c.19 1.1.97 1.73 1.95 1.73H17.4c.94 0 1.7-.58 1.93-1.47L22 2H3.97ZM7.19 15c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2ZM16.19 15c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Z" />,
                calculator: (
                    <>
                        <rect width="16" height="20" x="4" y="2" rx="2" />
                        <path d="M8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01" />
                    </>
                ),
                plus: <path d="M12 5v14M5 12h14" />,
                trash: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" />,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
                package: (
                    <>
                        <path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                        <path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12" />
                    </>
                ),
                tag: (
                    <>
                        <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
                        <path d="M7 7h.01" />
                    </>
                ),
                share: <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [productName, setProductName] = useState('สินค้าตัวอย่าง');
            const [channel, setChannel] = useState('Line / Facebook');
            const [basePrice, setBasePrice] = useState(100);
            const [quantity, setQuantity] = useState(1);
            const [tiers, setTiers] = useState([
                { id: 1, minQty: 10, specialPrice: 95 },
                { id: 2, minQty: 20, specialPrice: 90 }
            ]);

            const reportRef = useRef(null);

            const handleNumberChange = (value, setter) => {
                setter(value === '' ? '' : Number(value));
            };

            const addTier = () => {
                const newId = tiers.length > 0 ? Math.max(...tiers.map(t => t.id)) + 1 : 1;
                setTiers([...tiers, { id: newId, minQty: '', specialPrice: '' }]);
            };

            const removeTier = (id) => {
                setTiers(tiers.filter(tier => tier.id !== id));
            };

            const updateTier = (id, field, value) => {
                setTiers(tiers.map(tier => 
                    tier.id === id ? { ...tier, [field]: value === '' ? '' : Number(value) } : tier
                ));
            };

            const exportAsImage = () => {
                if (typeof html2canvas === 'undefined') return;
                html2canvas(reportRef.current, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    borderRadius: 40
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `pricing-report-${productName}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                });
            };

            return (
                <div className="min-h-screen bg-gray-50 p-4 md:p-10 font-sans">
                    <div className="max-w-2xl mx-auto space-y-8">
                        
                        {/* Control Panel */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-center justify-between">
                            <h1 className="font-bold text-gray-700 flex items-center gap-2">
                                <Icon name="tag" className="text-blue-500" />
                                ระบบจัดการราคาส่วนลด
                            </h1>
                            <div className="flex gap-2">
                                <button 
                                    onClick={addTier}
                                    className="flex items-center gap-2 bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-100 transition-all"
                                >
                                    <Icon name="plus" size={18} /> เพิ่มขั้น
                                </button>
                                <button 
                                    onClick={exportAsImage}
                                    className="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95"
                                >
                                    <Icon name="download" size={18} /> บันทึกรูปภาพ
                                </button>
                            </div>
                        </div>

                        {/* Report UI */}
                        <div 
                            ref={reportRef} 
                            className="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100 pb-12"
                        >
                            <div className="p-8 md:p-12 space-y-10">
                                <section>
                                    <div className="flex items-center gap-3 mb-8 text-blue-600 font-bold text-xl">
                                        <div className="p-2 bg-blue-50 rounded-xl">
                                            <Icon name="shoppingCart" size={24} />
                                        </div>
                                        <h2>ข้อมูลสินค้าและราคาปกติ</h2>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">ชื่อสินค้า/บริการ</label>
                                                <input 
                                                    type="text" 
                                                    value={productName}
                                                    onChange={(e) => setProductName(e.target.value)}
                                                    className="w-full bg-gray-50/50 border-b-2 border-gray-100 px-1 py-2 text-lg font-medium focus:ring-0 focus:border-blue-500 transition-all outline-none"
                                                    placeholder="ระบุชื่อสินค้า..."
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1 flex items-center gap-1">
                                                    <Icon name="share" size={10} /> ช่องทาง
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={channel}
                                                    onChange={(e) => setChannel(e.target.value)}
                                                    className="w-full bg-gray-50/50 border-b-2 border-gray-100 px-1 py-2 text-lg font-medium focus:ring-0 focus:border-blue-500 transition-all outline-none text-gray-600"
                                                    placeholder="ระบุช่องทาง..."
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-8 pt-2">
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">ราคาปกติ/หน่วย (฿)</label>
                                                <input 
                                                    type="number" 
                                                    value={basePrice}
                                                    onChange={(e) => handleNumberChange(e.target.value, setBasePrice)}
                                                    placeholder="0"
                                                    className="w-full bg-transparent border-b-2 border-gray-100 px-1 py-2 text-2xl font-bold text-blue-600 outline-none focus:border-blue-500"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">จำนวนที่สั่งซื้อ</label>
                                                <input 
                                                    type="number" 
                                                    value={quantity}
                                                    onChange={(e) => handleNumberChange(e.target.value, setQuantity)}
                                                    placeholder="0"
                                                    className="w-full bg-transparent border-b-2 border-gray-100 px-1 py-2 text-2xl font-bold text-gray-700 outline-none focus:border-blue-500"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section>
                                    <div className="flex items-center gap-3 mb-8 text-indigo-600 font-bold text-xl">
                                        <div className="p-2 bg-indigo-50 rounded-xl">
                                            <Icon name="calculator" size={24} />
                                        </div>
                                        <h2>กำหนดราคาแบบขั้นบันได</h2>
                                    </div>

                                    <div className="grid grid-cols-1 gap-4">
                                        {tiers.map((tier) => {
                                            const bPrice = basePrice || 0;
                                            const sPrice = tier.specialPrice || 0;
                                            const discountPercent = bPrice > 0 ? (((bPrice - sPrice) / bPrice) * 100).toFixed(1) : 0;
                                            const savingsPerUnit = bPrice - sPrice;
                                            
                                            return (
                                                <div key={tier.id} className="relative bg-white border border-gray-100 rounded-[1.5rem] p-6 shadow-sm hover:shadow-md transition-shadow group">
                                                    <button 
                                                        onClick={() => removeTier(tier.id)}
                                                        className="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors p-1"
                                                    >
                                                        <Icon name="trash" size={16} />
                                                    </button>

                                                    <div className="grid grid-cols-2 gap-6 mb-4">
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">ซื้อตั้งแต่ (หน่วย)</label>
                                                            <input 
                                                                type="number" 
                                                                value={tier.minQty}
                                                                onChange={(e) => updateTier(tier.id, 'minQty', e.target.value)}
                                                                placeholder="0"
                                                                className="w-full text-lg font-bold text-gray-700 border-b border-gray-100 py-1 outline-none focus:border-indigo-500 bg-transparent"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">ราคาพิเศษ/หน่วย (฿)</label>
                                                            <input 
                                                                type="number" 
                                                                value={tier.specialPrice}
                                                                onChange={(e) => updateTier(tier.id, 'specialPrice', e.target.value)}
                                                                placeholder="0"
                                                                className="w-full text-lg font-bold text-indigo-600 border-b border-gray-100 py-1 outline-none focus:border-indigo-500 bg-transparent"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div className="bg-emerald-50/60 rounded-2xl p-4 flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <div className="bg-white p-2 rounded-lg shadow-sm text-emerald-500">
                                                                <Icon name="package" size={18} />
                                                            </div>
                                                            <span className="text-sm font-bold text-emerald-700">คิดเป็นส่วนลด:</span>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-xl font-black text-emerald-600">{discountPercent}%</span>
                                                            <span className="text-gray-400 text-xs ml-2 font-medium">(ลดไป ฿{savingsPerUnit})</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            </div>
                        </div>

                        <p className="text-center text-gray-400 text-[10px] font-bold pb-10 uppercase tracking-[0.2em]">
                            Pricing Tier Management Tool
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
