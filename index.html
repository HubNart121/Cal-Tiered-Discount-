<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการราคาส่วนลดขั้นบันได</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@100;400;700&display=swap');
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        /* ซ่อนลูกศรใน input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .report-shadow {
            box-shadow: 0 10px 50px -12px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-[#F9FBFF]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                shoppingCart: <path d="m3.97 2 1.27 7.27c.19 1.1.97 1.73 1.95 1.73H17.4c.94 0 1.7-.58 1.93-1.47L22 2H3.97ZM7.19 15c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2ZM16.19 15c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Z" />,
                calculator: (
                    <>
                        <rect width="16" height="20" x="4" y="2" rx="2" />
                        <path d="M8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01" />
                    </>
                ),
                plus: <path d="M12 5v14M5 12h14" />,
                trash: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" />,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
                package: (
                    <>
                        <path d="m7.5 4.27 9 5.15M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                        <path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12" />
                    </>
                ),
                tag: (
                    <>
                        <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z" />
                        <path d="M7 7h.01" />
                    </>
                ),
                share: <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [productName, setProductName] = useState('air Bag Machine');
            const [channel, setChannel] = useState('Alibaba');
            const [basePrice, setBasePrice] = useState(11408.73);
            const [quantity, setQuantity] = useState('1-50');
            const [tiers, setTiers] = useState([
                { id: 1, minQty: '51-100', specialPrice: 10756.80 },
                { id: 2, minQty: '101', specialPrice: 9778 }
            ]);
            const [isExporting, setIsExporting] = useState(false);

            const reportRef = useRef(null);

            const handleNumberChange = (value, setter) => {
                setter(value === '' ? '' : Number(value));
            };

            const addTier = () => {
                const newId = tiers.length > 0 ? Math.max(...tiers.map(t => t.id)) + 1 : 1;
                setTiers([...tiers, { id: newId, minQty: '', specialPrice: '' }]);
            };

            const removeTier = (id) => {
                setTiers(tiers.filter(tier => tier.id !== id));
            };

            const updateTier = (id, field, value) => {
                setTiers(tiers.map(tier => 
                    tier.id === id ? { ...tier, [field]: value } : tier
                ));
            };

            const exportAsImage = async () => {
                if (typeof html2canvas === 'undefined' || isExporting) return;
                setIsExporting(true);
                try {
                    if (document.fonts) await document.fonts.ready;
                    await new Promise(resolve => setTimeout(resolve, 500));
                    const canvas = await html2canvas(reportRef.current, {
                        scale: 3,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        borderRadius: 40,
                    });
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL("image/png");
                    link.download = `pricing-report.png`;
                    link.click();
                    setIsExporting(false);
                } catch (error) {
                    console.error(error);
                    setIsExporting(false);
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-10 flex flex-col items-center">
                    <div className="w-full max-w-xl space-y-6">
                        
                        {/* Control Panel */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 overflow-hidden">
                                <Icon name="tag" className="text-blue-500 flex-shrink-0" size={18} />
                                <h1 className="font-bold text-gray-700 text-sm md:text-base truncate">ระบบจัดการราคาส่วนลด</h1>
                            </div>
                            <div className="flex gap-2 flex-shrink-0">
                                <button 
                                    onClick={addTier}
                                    className="flex items-center gap-1.5 bg-indigo-50 text-indigo-600 px-3 py-2 rounded-xl text-xs md:text-sm font-bold hover:bg-indigo-100 transition-all"
                                >
                                    <Icon name="plus" size={16} /> <span>เพิ่มขั้น</span>
                                </button>
                                <button 
                                    onClick={exportAsImage}
                                    disabled={isExporting}
                                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs md:text-sm font-bold shadow-lg shadow-blue-100 transition-all active:scale-95 ${isExporting ? 'bg-gray-400' : 'bg-blue-600 text-white hover:bg-blue-700'}`}
                                >
                                    <Icon name="download" size={16} /> <span>{isExporting ? 'บันทึก...' : 'บันทึกรูปภาพ'}</span>
                                </button>
                            </div>
                        </div>

                        {/* Report Canvas */}
                        <div 
                            ref={reportRef} 
                            className="bg-white rounded-[2.5rem] report-shadow overflow-hidden border border-gray-50 pb-10"
                        >
                            <div className="p-6 md:p-10 space-y-10">
                                
                                {/* Section 1: ข้อมูลสินค้า */}
                                <section>
                                    <div className="flex items-center gap-3 mb-8 text-blue-600 font-bold text-lg md:text-xl px-2">
                                        <div className="p-2.5 bg-blue-50 rounded-2xl">
                                            <Icon name="shoppingCart" size={22} />
                                        </div>
                                        <h2>ข้อมูลสินค้าและราคาปกติ</h2>
                                    </div>

                                    <div className="space-y-6 px-2">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                                            <div className="space-y-2">
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em] ml-1">ชื่อสินค้า/บริการ</label>
                                                <input 
                                                    type="text" 
                                                    value={productName}
                                                    onChange={(e) => setProductName(e.target.value)}
                                                    className="w-full bg-gray-50/50 border-b-2 border-gray-100 px-1 py-2 text-base md:text-lg font-medium focus:border-blue-500 transition-all outline-none"
                                                />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em] ml-1 flex items-center gap-1">
                                                    <Icon name="share" size={10} /> ช่องทาง
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={channel}
                                                    onChange={(e) => setChannel(e.target.value)}
                                                    className="w-full bg-gray-50/50 border-b-2 border-gray-100 px-1 py-2 text-base md:text-lg font-medium focus:border-blue-500 transition-all outline-none text-gray-600"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-6 md:gap-8 pt-2">
                                            <div className="space-y-2">
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em] ml-1">ราคาปกติ/หน่วย (฿)</label>
                                                <input 
                                                    type="number" 
                                                    value={basePrice}
                                                    onChange={(e) => handleNumberChange(e.target.value, setBasePrice)}
                                                    className="w-full bg-transparent border-b-2 border-gray-100 px-1 py-2 text-xl md:text-2xl font-bold text-blue-600 outline-none focus:border-blue-500"
                                                />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em] ml-1">จำนวนที่สั่งซื้อ</label>
                                                <input 
                                                    type="text" 
                                                    value={quantity}
                                                    onChange={(e) => setQuantity(e.target.value)}
                                                    className="w-full bg-transparent border-b-2 border-gray-100 px-1 py-2 text-xl md:text-2xl font-bold text-gray-700 outline-none focus:border-blue-500"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* Section 2: ขั้นบันไดราคา */}
                                <section>
                                    <div className="flex items-center gap-3 mb-8 text-indigo-600 font-bold text-lg md:text-xl px-2">
                                        <div className="p-2.5 bg-indigo-50 rounded-2xl">
                                            <Icon name="calculator" size={22} />
                                        </div>
                                        <h2>กำหนดราคาแบบขั้นบันได</h2>
                                    </div>

                                    <div className="grid grid-cols-1 gap-5 px-2">
                                        {tiers.map((tier) => {
                                            const bPrice = Number(basePrice) || 0;
                                            const sPrice = Number(tier.specialPrice) || 0;
                                            const discountPercent = bPrice > 0 ? (((bPrice - sPrice) / bPrice) * 100).toFixed(2) : "0.00";
                                            const savingsPerUnit = (bPrice - sPrice).toFixed(2);
                                            
                                            return (
                                                <div key={tier.id} className="relative bg-white border border-gray-100 rounded-[2rem] p-5 md:p-6 shadow-sm hover:shadow-md transition-all group">
                                                    <button 
                                                        onClick={() => removeTier(tier.id)}
                                                        className="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors p-1"
                                                    >
                                                        <Icon name="trash" size={16} />
                                                    </button>

                                                    <div className="grid grid-cols-2 gap-5 md:gap-8 mb-5">
                                                        <div className="space-y-1.5">
                                                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">ซื้อตั้งแต่ (หน่วย)</label>
                                                            <input 
                                                                type="text" 
                                                                value={tier.minQty}
                                                                onChange={(e) => updateTier(tier.id, 'minQty', e.target.value)}
                                                                className="w-full text-lg font-bold text-gray-700 border-b border-gray-100 py-1 outline-none focus:border-indigo-500 bg-transparent"
                                                            />
                                                        </div>
                                                        <div className="space-y-1.5">
                                                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">ราคาพิเศษ/หน่วย (฿)</label>
                                                            <input 
                                                                type="number" 
                                                                value={tier.specialPrice}
                                                                onChange={(e) => updateTier(tier.id, 'specialPrice', e.target.value === '' ? '' : Number(e.target.value))}
                                                                className="w-full text-lg font-bold text-indigo-600 border-b border-gray-100 py-1 outline-none focus:border-indigo-500 bg-transparent"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div className="bg-[#F2FAF6] rounded-2xl p-4 md:p-5 flex items-center justify-between">
                                                        <div className="flex items-center gap-3">
                                                            <div className="bg-white p-2 rounded-xl shadow-sm text-emerald-500">
                                                                <Icon name="package" size={18} />
                                                            </div>
                                                            <div className="flex flex-col">
                                                                <span className="text-[11px] font-bold text-emerald-800 leading-tight">คิดเป็น</span>
                                                                <span className="text-[11px] font-bold text-emerald-800 leading-tight">ส่วนลด:</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-xl md:text-2xl font-black text-emerald-600 leading-none">{discountPercent}%</span>
                                                            <div className="flex flex-col items-end border-l border-emerald-100 pl-3">
                                                                <span className="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">ลดไป</span>
                                                                <span className="text-xs font-bold text-emerald-700/70">฿{Number(savingsPerUnit).toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            </div>
                        </div>

                        <p className="text-center text-gray-400 text-[9px] font-bold pb-6 uppercase tracking-[0.3em]">
                            Pricing Tier Management Tool
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
